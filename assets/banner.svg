<svg width="900" height="240" viewBox="0 0 900 240" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Bandwise — IELTS Coach for Claude Code">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="900" y2="240" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1e293b"/>
      <stop offset="0.55" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="240" x2="0" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#9a7b4f"/>
      <stop offset="1" stop-color="#ece7dc"/>
    </linearGradient>
  </defs>
  <rect width="900" height="240" rx="24" fill="url(#bg)"/>

  <!-- icon: ascending bars + trend -->
  <g transform="translate(56,58)">
    <rect x="0"  y="78" width="20" height="44" rx="4" fill="url(#bar)"/>
    <rect x="30" y="56" width="20" height="66" rx="4" fill="url(#bar)"/>
    <rect x="60" y="32" width="20" height="90" rx="4" fill="url(#bar)"/>
    <rect x="90" y="8"  width="20" height="114" rx="4" fill="url(#bar)"/>
    <path d="M8 76 L40 54 L70 30 L100 7" stroke="#ece7dc" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.95"/>
    <circle cx="100" cy="7" r="6" fill="#ece7dc"/>
  </g>

  <!-- wordmark (serif, editorial) -->
  <text x="250" y="118" font-family="Georgia, 'Times New Roman', 'Noto Serif SC', serif" font-size="74" font-weight="700" fill="#ece7dc" letter-spacing="-1">Bandwise</text>
  <text x="252" y="158" font-family="Georgia, 'Times New Roman', serif" font-size="25" font-weight="400" fill="#b9a888" font-style="italic">IELTS Coach for Claude Code</text>
  <text x="252" y="192" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#8a8578">10 skills · 证据级 · 本地优先 · 数据不离开你的电脑</text>
</svg>
