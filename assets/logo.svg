<svg width="160" height="160" viewBox="0 0 160 160" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Bandwise logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="160" y2="160" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0EA5E9"/>
      <stop offset="1" stop-color="#1E3A8A"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="160" x2="0" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FACC15"/>
      <stop offset="1" stop-color="#FDE68A"/>
    </linearGradient>
  </defs>
  <rect width="160" height="160" rx="34" fill="url(#bg)"/>
  <!-- ascending bars: band score climbing -->
  <rect x="34"  y="98"  width="18" height="34" rx="4" fill="url(#bar)"/>
  <rect x="60"  y="78"  width="18" height="54" rx="4" fill="url(#bar)"/>
  <rect x="86"  y="56"  width="18" height="76" rx="4" fill="url(#bar)"/>
  <rect x="112" y="34"  width="18" height="98" rx="4" fill="url(#bar)"/>
  <!-- trend arrow -->
  <path d="M40 96 L69 76 L95 54 L122 33" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.9"/>
  <circle cx="122" cy="33" r="5.5" fill="#FFFFFF"/>
</svg>
