<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Bandwise monogram">
  <!-- warm paper tile -->
  <rect x="0" y="0" width="200" height="200" rx="44" fill="#f4f3ef"/>
  <!-- inset hairline frame (colophon) -->
  <rect x="12" y="12" width="176" height="176" rx="34" fill="none" stroke="#0f172a" stroke-width="1.4"/>
  <!-- thin ink ring echoing the buyun favicon grammar -->
  <circle cx="100" cy="96" r="60" fill="none" stroke="#0f172a" stroke-width="1"/>
  <!-- serif monogram -->
  <text x="100" y="124" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="92" font-weight="700" fill="#0f172a">B</text>
  <!-- letter-spaced wordmark under the rule -->
  <line x1="58" y1="150" x2="142" y2="150" stroke="#0f172a" stroke-width="0.9"/>
  <text x="100" y="171" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="13" letter-spacing="6" fill="#0f172a">BANDWISE</text>
  <!-- bronze colophon dot -->
  <circle cx="100" cy="40" r="2.8" fill="#9a7b4f"/>
</svg>
